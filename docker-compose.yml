services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xlhome_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./storage:/var/www/storage
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    networks:
      - xlhome_network

  webserver:
    image: nginx:alpine
    container_name: xlhome_webserver
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - xlhome_network

networks:
  xlhome_network:
    driver: bridge
