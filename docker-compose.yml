services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xlhome_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - /var/www/vendor
      - ./storage:/var/www/storage
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
    networks:
      - xlhome_network

  webserver:
    image: nginx:alpine
    container_name: xlhome_webserver
    restart: unless-stopped
    ports:
      # Bind to 127.0.0.1 on the host for VPS Nginx reverse proxying
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - xlhome_network

networks:
  xlhome_network:
    driver: bridge
